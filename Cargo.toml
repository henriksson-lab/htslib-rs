[package]
name = "htslib_rs"
version = "0.0.1"
edition = "2021"
license = "MIT OR BSD-3-Clause"
description = "Rust translation of HTSlib"
readme = "README.md"

[lib]
name = "htslib_rs"
path = "src/lib.rs"

# `parity` enables the hts-sys (C HTSlib) dependency. The goal is to remove
# hts_sys from production code entirely; it is retained only for (a) parity
# tests that compare native output against the C library and (b) transitional
# delegation while subsystems are still being translated. `parity` is in
# `default` so the crate builds today; the authoritative "are we done"
# signal is `cargo build --no-default-features` (no hts_sys) compiling cleanly.
# See docs/HTS_SYS_CUTOVER.md.
[features]
default = ["parity", "cram-mirror"]
parity = ["dep:hts-sys"]
cram-mirror = ["dep:c2rust-bitfields"]
gcs = ["libcurl"]
libcurl = []
s3 = ["libcurl"]

[dependencies]
c2rust-bitfields = { version = "0.22.1", optional = true }
flate2 = "1"
hts-sys = { version = "2.2.0", optional = true }
libc = "0.2"
tracehash-rs = "0.2.0"
xz2 = "0.1"

[dev-dependencies]
noodles = { version = "0.109.0", features = ["bgzf"] }

# Redirect hts-sys to the locally vendored crate, which links the in-tree v1.23
# HTSlib source (HTS_VERSION 102390) and regenerates bindgen bindings against it.
# This keeps the C `hts_sys::*` structs byte-identical to the native Rust
# translation (which targets v1.23), fixing the v1.19.1 ABI mismatch.
[patch.crates-io]
hts-sys = { path = "third_party/hts-sys" }
