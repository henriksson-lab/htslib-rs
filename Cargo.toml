[package]
name = "htslib_rs"
version = "0.0.1"
edition = "2021"
license = "MIT OR BSD-3-Clause"
description = "Rust translation of HTSlib"
readme = "README.md"

[lib]
name = "htslib_rs"
path = "src/lib.rs"

# `parity` enables hts-sys in tests for byte-identical comparison against
# C HTSlib. Production code does not depend on hts-sys at all (cut-over
# completed 2026-06-01); the feature gates only test-side parity helpers.
[features]
default = ["parity"]
parity = []
bin-mimalloc = ["dep:mimalloc"]
gcs = ["libcurl"]
libcurl = []
s3 = ["libcurl"]

[dependencies]
# `zlib-rs` selects flate2's pure-Rust zlib-rs backend (a Rust port of zlib, no
# C). It also enables flate2's `any_zlib` API surface (`Compress::new_gzip` /
# `Decompress::new_gzip`) used by the BGZF gzip-stream paths and the CRAM
# gzip deflate; the default `miniz_oxide` backend does not expose those.
flate2 = { version = "1", features = ["zlib-rs"] }
# Direct dep on the pure-Rust zlib-rs (already in the tree as flate2's backend):
# the CRAM gzip codec passes a zlib `strategy` (e.g. GZIP_RLE = Z_RLE) that
# flate2's wrapper can't express, so that one deflate call uses zlib-rs directly.
zlib-rs = "0.6"
libc = "0.2"
mimalloc = { version = "0.1", optional = true }
regex = "1"
tracehash-rs = "0.2.0"
xz2 = "0.1"

[dev-dependencies]
noodles = { version = "0.109.0", features = ["bgzf"] }
# hts-sys is used ONLY by parity-comparison tests now; not a runtime dep.
hts-sys = "2.2.0"

# Redirect hts-sys to the locally vendored crate, which links the in-tree v1.23
# HTSlib source (HTS_VERSION 102390) and regenerates bindgen bindings against it.
# This keeps the C `hts_sys::*` structs byte-identical to the native Rust
# translation (which targets v1.23), fixing the v1.19.1 ABI mismatch.
[patch.crates-io]
hts-sys = { path = "third_party/hts-sys" }
